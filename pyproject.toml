[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-rates"
version = "0.1.1"
description = "自研利率研究库：曲线 bootstrap、Nelson-Siegel/Svensson、Vasicek/CIR/Hull-White、债券与互换定价、关键利率久期。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhuoming Wang" }]
keywords = ["quant", "fixed-income", "yield-curve", "interest-rate", "hull-white", "swaps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/Bruce848647703/kairos-rates"
Source = "https://github.com/Bruce848647703/kairos-rates"
Issues = "https://github.com/Bruce848647703/kairos-rates/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[project.scripts]
kairos-rates = "kairos_rates.cli:main"

[tool.setuptools.packages.find]
include = ["kairos_rates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
